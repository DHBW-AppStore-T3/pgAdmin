name: Build images (pod runtime)

# Builds the two images that appstore.yaml refers to, by digest, and smoke-tests
# them the way the platform runs them (UID 1000, read-only root, no capabilities).
# On pull requests the images are only built and tested locally, nothing is pushed.
# After a build on main or dev, copy the digests from the job summaries into
# appstore.yaml and tag a new version: the AppStore only deploys images pinned by digest.
on:
  push:
    branches: [main, dev]
    paths: ['image/**', '.github/workflows/image.yml']
  pull_request:
    branches: [main, dev]
    paths: ['image/**', '.github/workflows/image.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  postgres:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/dhbw-appstore-t3/apps/pgadmin-postgres
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: image/postgres
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Digest
        if: github.event_name != 'pull_request'
        run: |
          echo "### Image digest (postgres)" >> "$GITHUB_STEP_SUMMARY"
          echo '`${{ env.IMAGE }}@${{ steps.build.outputs.digest }}`' >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke test (platform security context)
        env:
          REF: ${{ github.event_name == 'pull_request' && format('{0}:{1}', env.IMAGE, github.sha) || format('{0}@{1}', env.IMAGE, steps.build.outputs.digest) }}
        run: |
          docker run -d --name pg --user 1000:1000 --read-only --cap-drop ALL \
            --security-opt no-new-privileges --network host \
            --tmpfs /tmp --tmpfs /var/lib/pgadmin:uid=1000,gid=1000 \
            "$REF"
          for i in $(seq 1 30); do
            PGPASSWORD=pagila docker exec -e PGPASSWORD=pagila pg \
              psql -h localhost -U pagila_user -d pagila -tAc 'select count(*) from film' && ok=1 && break
            sleep 2
          done
          docker logs pg
          test "${ok:-0}" = 1

  pgadmin:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/dhbw-appstore-t3/apps/pgadmin
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: image/pgadmin
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Digest
        if: github.event_name != 'pull_request'
        run: |
          echo "### Image digest (pgadmin)" >> "$GITHUB_STEP_SUMMARY"
          echo '`${{ env.IMAGE }}@${{ steps.build.outputs.digest }}`' >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke test (platform security context)
        env:
          REF: ${{ github.event_name == 'pull_request' && format('{0}:{1}', env.IMAGE, github.sha) || format('{0}@{1}', env.IMAGE, steps.build.outputs.digest) }}
        run: |
          docker run -d --name pga --user 1000:1000 --read-only --cap-drop ALL \
            --security-opt no-new-privileges --network host \
            --tmpfs /tmp --tmpfs /var/lib/pgadmin:uid=1000,gid=1000 \
            -e HOME=/tmp -e PGADMIN_LISTEN_PORT=8080 -e PGADMIN_DISABLE_POSTFIX=1 \
            -e PGADMIN_DEFAULT_EMAIL=pgadmin@dhbw.de -e PGADMIN_DEFAULT_PASSWORD=ci-smoke-test \
            "$REF"
          for i in $(seq 1 40); do
            curl -fsS -o /dev/null "http://[::1]:8080/login" && ok=1 && break
            sleep 3
          done
          docker logs pga
          test "${ok:-0}" = 1
